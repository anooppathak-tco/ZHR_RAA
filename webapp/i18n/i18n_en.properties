justificationInfo=<p style='margin:0in;'><strong><span style="color:red;">Attention</span>:&nbsp;</strong>How to write a justification properly</p><ul style="margin-bottom:0in;margin-top:0in;" type="disc"><li><strong>Specify the achievement:</strong>&nbsp;Describe the specific achievement, ensuring it goes beyond standard job duties, e.g. process optimization, cost saving, innovation, project, etc.</li><li><strong>Use metrics:</strong>&nbsp;Be measurable to support your nomination; include results, numbers and impact, e.g. &ldquo;cost savings of $1MM&rdquo;, etc. &nbsp;</li><li><strong>Be clear and concise:</strong>&nbsp;Avoid unclear statements, e.g. &ldquo;outstanding leadership&rdquo;, &ldquo;hard work&rdquo;, etc.&nbsp;</li></ul>
